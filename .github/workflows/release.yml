# PokéBonk desktop client (docs/DESKTOP.md in the game's repo). This repo (CharcherGit/pokebonk-app) holds the client's source, a copy
# of the game repo's desktop/ folder (`npm run sync:repo` there), and its downloads. A tag `v*` builds Windows, macOS and Linux on
# GitHub's machines and leaves everything in a DRAFT release of that tag: the installers plus latest*.yml and the .blockmap files the
# automatic updater reads (src/updater.ts). Publishing the draft is what makes the clients update. Also by hand (Actions → Release →
# Run workflow): the installers stay as the run's artifacts.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            # ASCII bundle name: with «é» the helpers end up NFD and CFBundleName NFC, and the app crashes on launch (issue #5).
            target: --mac -c.productName=PokeBonk
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Electron + builder tool binaries (~hundreds of MB per platform): cached across runs, keyed on the
      # locked electron version so a bump re-fetches once.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The remaining deprecation warnings (rimraf@2 via temp, glob@7/inflight via asar, boolean via
      # global-agent, lodash.isequal via electron-updater) all live inside electron-builder/updater's own
      # dependency pins — nothing to upgrade or override this side. Error level keeps the log clean; real
      # failures still surface.
      - run: npm ci --no-audit --no-fund --loglevel=error
      - run: npm run build
      # Version + update feed come from the tag when built from one (v1.4.0-cprivitere.1 → version 1.4.0-cprivitere.1,
      # owner = this repo's owner), else package.json + electron-builder.yml defaults (manual runs).
      - run: |
          extra=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then extra="-c.extraMetadata.version=${GITHUB_REF#refs/tags/v}"; fi
          npx electron-builder ${{ matrix.target }} --publish never $extra -c.publish.owner="$GITHUB_REPOSITORY_OWNER" -c.publish.repo=pokebonk-app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The DMG as players get it: the helpers must have exactly the bytes of CFBundleName, and the app must start and quit by itself.
      - name: Check the macOS app from the DMG
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          trap 'hdiutil detach /tmp/pb 2>/dev/null || true' EXIT
          dmg=$(ls release/*.dmg | head -1)
          hdiutil attach "$dmg" -mountpoint /tmp/pb -nobrowse -readonly
          app=$(ls -d /tmp/pb/*.app | head -1)
          name=$(plutil -extract CFBundleName raw -o - "$app/Contents/Info.plist")
          exe=$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")
          ls "$app/Contents/Frameworks" | grep ' Helper' | sed 's/ Helper.*//' | sort -u > /tmp/helpers.txt
          echo "CFBundleName: $name"; cat /tmp/helpers.txt
          [ "$(cat /tmp/helpers.txt)" = "$name" ] || { echo "Helper names do not match CFBundleName"; exit 1; }
          # The launch is the flaky part (cold runners stall on the first boot: Chromium's network service
          # crashes and restarts). No priming: a kill -9'd throwaway leaves GPU/network children behind that
          # fight the real launch over the profile. The helper-name check above stays fail-fast (deterministic
          # packaging); only the launch retries, up to 3 times at 90s + 5s backoff, before failing the job.
          attempt=1
          until [ $attempt -gt 3 ]; do
            echo "Self-test attempt $attempt/3"
            rm -rf /tmp/st
            "$app/Contents/MacOS/$exe" --selftest=/tmp/st --selftest-wait=6000 &
            pid=$!
            for i in $(seq 1 90); do kill -0 $pid 2>/dev/null || break; sleep 1; done
            if kill -0 $pid 2>/dev/null; then kill $pid; echo "Self-test did not finish (attempt $attempt)"; attempt=$((attempt + 1)); sleep 5; continue; fi
            wait $pid || echo "Self-test exited non-zero (attempt $attempt)"
            if [ ! -s /tmp/st/report.json ]; then echo "No report (attempt $attempt)"; attempt=$((attempt + 1)); sleep 5; continue; fi
            cat /tmp/st/report.json
            break
          done
          [ $attempt -gt 3 ] && { echo "Self-test failed after 3 attempts"; exit 1; }
          hdiutil detach /tmp/pb
      - uses: actions/upload-artifact@v7
        with:
          name: pokebonk-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          # v1.4.0 → full release; v1.4.0-anything → prerelease (stable clients never offered it).
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: PokéBonk ${{ github.ref_name }}
          files: dist/*
