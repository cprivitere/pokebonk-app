# PokéBonk desktop client (docs/DESKTOP.md in the game's repo). This repo (CharcherGit/pokebonk-app) holds the client's source, a copy
# of the game repo's desktop/ folder (`npm run sync:repo` there), and its downloads. A tag `v*` builds Windows, macOS and Linux on
# GitHub's machines and leaves everything in a DRAFT release of that tag: the installers plus latest*.yml and the .blockmap files the
# automatic updater reads (src/updater.ts). Publishing the draft is what makes the clients update. Also by hand (Actions → Release →
# Run workflow): the installers stay as the run's artifacts.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          # macOS disabled 2026-11-07: DMG self-test hangs on macos-latest (app never exits within 90 s),
          # see run 42337371830 / job 128297248826. Re-enable by uncommenting the three lines below.
          # - os: macos-latest
          #   # ASCII bundle name: with «é» the helpers end up NFD and CFBundleName NFC, and the app crashes on launch (issue #5).
          #   target: --mac -c.productName=PokeBonk
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # No certificates: ad-hoc signature on the Mac (electron-builder.yml) and none on Windows.
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The DMG as players get it: the helpers must have exactly the bytes of CFBundleName, and the app must start and quit by itself.
      - name: Check the macOS app from the DMG
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dmg=$(ls release/*.dmg | head -1)
          hdiutil attach "$dmg" -mountpoint /tmp/pb -nobrowse -readonly
          app=$(ls -d /tmp/pb/*.app | head -1)
          name=$(plutil -extract CFBundleName raw -o - "$app/Contents/Info.plist")
          exe=$(plutil -extract CFBundleExecutable raw -o - "$app/Contents/Info.plist")
          ls "$app/Contents/Frameworks" | grep ' Helper' | sed 's/ Helper.*//' | sort -u > /tmp/helpers.txt
          echo "CFBundleName: $name"; cat /tmp/helpers.txt
          [ "$(cat /tmp/helpers.txt)" = "$name" ] || { echo "Helper names do not match CFBundleName"; exit 1; }
          "$app/Contents/MacOS/$exe" --selftest=/tmp/st --selftest-wait=6000 &
          pid=$!
          for i in $(seq 1 90); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill -0 $pid 2>/dev/null && { kill $pid; echo "Self-test did not finish"; exit 1; }
          wait $pid
          cat /tmp/st/report.json
          hdiutil detach /tmp/pb
      - uses: actions/upload-artifact@v7
        with:
          name: pokebonk-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: PokéBonk ${{ github.ref_name }}
          files: dist/*
